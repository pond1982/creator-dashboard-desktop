appId: dev.creatordashboard.desktop
productName: Argus Pip
directories:
  output: dist
  buildResources: build
asar: true
afterPack: ./mac-widget/build.cjs
files:
  - desktop/**/*
  - analytics.mjs
  - apple.mjs
  - dashboard.mjs
  - keychain.mjs
  - paths.mjs
  - reports.mjs
  - server.mjs
  - settings.mjs
  - youtube.mjs
  - report.css
  - public/**/*
  - LICENSE
mac:
  target: dmg
  category: public.app-category.business
  # Ad-hoc signatures allow native launch on Apple Silicon; no Developer ID is bundled.
  identity: "-"
  notarize: false
  signIgnore:
    - '/Contents/PlugIns/ArgusPipWidget\.appex(?:/|$)'
  protocols:
    - name: Open Argus Pip
      schemes: [arguspip]
  artifactName: 'Argus-Pip-${version}-mac-${arch}.${ext}'
win:
  target: nsis
  artifactName: 'Argus-Pip-${version}-win-${arch}.${ext}'
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
publish: null
